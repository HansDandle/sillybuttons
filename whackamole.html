<div id="whackamole-game" class="whackamole-container">
  <h2>Whack-a-Sea-Creature!</h2>
  <div class="scoreboard">Score: <span id="wm-score">0</span></div>
  <div class="wm-grid">
    <div class="wm-hole" data-index="0"></div>
    <div class="wm-hole" data-index="1"></div>
    <div class="wm-hole" data-index="2"></div>
    <div class="wm-hole" data-index="3"></div>
    <div class="wm-hole" data-index="4"></div>
    <div class="wm-hole" data-index="5"></div>
  </div>
  <button id="wm-start">Start Game</button>
</div>
